spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/request_management
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    locations: classpath:db/migration

  h2:
    console:
      enabled: false

logging:
  level:
    com.enoca: INFO
